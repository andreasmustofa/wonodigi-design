<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wonodigi — Solusi Digital</title>
  <meta
    name="description"
    content="Menuju website Wonodigi..."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .page {
      position: relative;
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(56, 189, 248, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(14, 165, 233, 0.12),
          transparent 30%
        ),
        #0f172a;
    }

    /* Background grid */
    .grid {
      position: absolute;
      inset: -50%;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 12s linear infinite;
    }

    /* Floating lights */
    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.22;
      pointer-events: none;
    }

    .orb.one {
      top: -100px;
      left: -80px;
      background: #38bdf8;
      animation: floatOne 8s ease-in-out infinite;
    }

    .orb.two {
      right: -100px;
      bottom: -100px;
      background: #0ea5e9;
      animation: floatTwo 10s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(90%, 600px);
      text-align: center;
      animation: contentIn 1s ease-out both;
    }

    .logo {
      position: relative;
      display: inline-flex;
      width: 86px;
      height: 86px;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.7);
      box-shadow:
        0 0 50px rgba(56, 189, 248, 0.18),
        inset 0 0 30px rgba(56, 189, 248, 0.06);
      backdrop-filter: blur(15px);
      animation: logoFloat 3s ease-in-out infinite;
    }

    .logo::before {
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 30px;
      content: "";
      animation: pulse 2s ease-out infinite;
    }

    .logo span {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #38bdf8;
    }

    .eyebrow {
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7dd3fc;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(42px, 10vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    h1 span {
      color: #38bdf8;
    }

    .description {
      margin: 0 auto 30px;
      max-width: 460px;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.7;
    }

    .loader {
      width: 180px;
      height: 4px;
      margin: 0 auto 18px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.15);
    }

    .loader-bar {
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        transparent,
        #38bdf8,
        #7dd3fc,
        transparent
      );
      animation: loading 1.3s ease-in-out infinite;
    }

    .redirect-text {
      font-size: 13px;
      color: #64748b;
    }

    .redirect-text strong {
      color: #94a3b8;
      font-weight: 600;
    }

    .skip {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 18px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.5);
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .skip:hover {
      border-color: rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
      transform: translateY(-2px);
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #7dd3fc;
      opacity: 0;
      animation: particle 5s linear infinite;
    }

    .particle:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 25%;
      animation-delay: 1s;
    }

    .particle:nth-child(3) {
      left: 42%;
      animation-delay: 2.4s;
    }

    .particle:nth-child(4) {
      left: 60%;
      animation-delay: 0.8s;
    }

    .particle:nth-child(5) {
      left: 75%;
      animation-delay: 3s;
    }

    .particle:nth-child(6) {
      left: 90%;
      animation-delay: 1.7s;
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.8;
        transform: scale(0.95);
      }

      100% {
        opacity: 0;
        transform: scale(1.15);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-130%);
      }

      100% {
        transform: translateX(320%);
      }
    }

    @keyframes gridMove {
      from {
        transform: perspective(500px) rotateX(60deg) translateY(0);
      }

      to {
        transform: perspective(500px) rotateX(60deg) translateY(50px);
      }
    }

    @keyframes floatOne {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(80px, 50px);
      }
    }

    @keyframes floatTwo {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-70px, -50px);
      }
    }

    @keyframes particle {
      0% {
        top: 110%;
        opacity: 0;
      }

      15% {
        opacity: 0.5;
      }

      85% {
        opacity: 0.2;
      }

      100% {
        top: -10%;
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="particles">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <section class="content">
      <div class="logo">
        <span>W</span>
      </div>

      <p class="eyebrow">Solusi Digital</p>

      <h1>
        Wono<span>digi</span>
      </h1>

      <p class="description">
        Kami sedang mengantarkan kamu menuju website Wonodigi.
      </p>

      <div class="loader">
        <div class="loader-bar"></div>
      </div>

      <p class="redirect-text">
        Mengarahkan ke <strong>wonodigi.id</strong>
      </p>

      <a
        class="skip"
        href="https://wonodigi.id"
      >
        Buka sekarang →
      </a>
    </section>
  </main>

  <script>
    const target = "https://wonodigi.id";

    // Redirect setelah 3 detik
    setTimeout(() => {
      window.location.replace(target);
    }, 3000);
  </script>
</body>
</html>
